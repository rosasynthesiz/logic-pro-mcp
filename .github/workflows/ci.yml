name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --frozen
      - run: uv run pytest -m 'not live'
      - run: uv run python scripts/check_inspection.py
  linux-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --frozen
      - run: uv run python scripts/check_inspection.py
      - name: Refuse normal startup on Linux
        run: |
          if uv run logic-pro-mcp >startup.log 2>&1; then exit 1; fi
          grep -q 'Logic Pro control requires macOS' startup.log
